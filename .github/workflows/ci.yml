name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  JWT_SECRET: test-secret-key-min-32-characters-long
  JWT_REFRESH_SECRET: test-refresh-secret-min-32-characters-long
  WEBHOOK_SECRET: test-webhook-secret-min-32-characters
  REDIS_HOST: localhost

jobs:
  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/typescript
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

  swagger:
    name: Swagger Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run swagger:export
      - name: Upload swagger.json
        uses: actions/upload-artifact@v4
        with:
          name: swagger
          path: swagger.json

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, build, security, swagger]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t job-applications-api:${{ github.sha }} .
      - name: Verify image runs
        run: |
          docker run -d --name test-container \
            -e NODE_ENV=test \
            -e JWT_SECRET=test-secret-key-min-32-characters-long \
            -e JWT_REFRESH_SECRET=test-refresh-secret-min-32-characters-long \
            -e WEBHOOK_SECRET=test-webhook-secret-min-32-characters \
            -e REDIS_HOST=host.docker.internal \
            -p 3000:3000 \
            job-applications-api:${{ github.sha }}
          sleep 5
          curl -f http://localhost:3000/api/v1/health || exit 1
          docker stop test-container

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test -- --coverage --forceExit
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --forceExit
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e
          path: coverage/
